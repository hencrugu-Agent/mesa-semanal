<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#E5DCCE"/>
    </radialGradient>
    <radialGradient id="stewGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A16207"/>
      <stop offset="60%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>
  </defs>
  <!-- Background warm table -->
  <rect width="400" height="300" fill="#FDFBF7"/>
  <circle cx="200" cy="150" r="135" fill="#E8DFD3" opacity="0.6"/>
  
  <!-- Plato hondo artesanal -->
  <circle cx="200" cy="150" r="125" fill="url(#plateGrad)" stroke="#D5C5B2" stroke-width="3"/>
  <circle cx="200" cy="150" r="105" fill="#FBF7EE" stroke="#EFE6D8" stroke-width="2"/>
  
  <!-- Lentejas guisadas -->
  <ellipse cx="175" cy="155" rx="75" ry="60" fill="url(#stewGrad)"/>
  <!-- Granos de lentejas individuales -->
  <circle cx="150" cy="140" r="7" fill="#B45309"/>
  <circle cx="170" cy="135" r="8" fill="#92400E"/>
  <circle cx="190" cy="145" r="7.5" fill="#B45309"/>
  <circle cx="140" cy="160" r="8" fill="#78350F"/>
  <circle cx="165" cy="165" r="7" fill="#B45309"/>
  <circle cx="185" cy="170" r="7.5" fill="#92400E"/>
  <circle cx="150" cy="180" r="7" fill="#B45309"/>
  
  <!-- Porción de arroz graneado blanco -->
  <ellipse cx="235" cy="145" rx="45" ry="38" fill="#FFFFFF" stroke="#E2D9CC" stroke-width="1.5"/>
  <ellipse cx="235" cy="142" rx="40" ry="32" fill="#FAF6EE"/>
  <!-- Textura granos de arroz -->
  <ellipse cx="225" cy="135" rx="4" ry="2" fill="#E5DCCE"/>
  <ellipse cx="240" cy="130" rx="3.5" ry="1.8" fill="#E5DCCE"/>
  <ellipse cx="250" cy="142" rx="4" ry="2" fill="#E5DCCE"/>
  <ellipse cx="230" cy="150" rx="4" ry="2" fill="#E5DCCE"/>

  <!-- Huevo frito montado criollo -->
  <ellipse cx="180" cy="135" rx="35" ry="26" fill="#FFFFFF" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.15))"/>
  <!-- Yema tierna dorada -->
  <circle cx="175" cy="133" r="14" fill="#F59E0B"/>
  <circle cx="172" cy="130" r="11" fill="#FBBF24"/>
  <circle cx="170" cy="127" r="3" fill="#FFFFFF" opacity="0.8"/>
  <!-- Borde crocante tostado de clara -->
  <path d="M 148 135 Q 155 145 165 148 Q 190 152 205 142" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Hojas de culantro fresco picado -->
  <path d="M 175 160 Q 180 155 185 160 Q 180 165 175 160" fill="#15803D"/>
  <path d="M 195 150 Q 200 145 205 150 Q 200 155 195 150" fill="#16A34A"/>
  
  <!-- Sello decorativo 'Criollo' -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">ALMUERZO</text>
</svg>
