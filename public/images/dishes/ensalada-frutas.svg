<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FDFBF7"/>

  <!-- Bowl de vidrio / cerámica blanca -->
  <ellipse cx="200" cy="180" rx="100" ry="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2.5"/>
  <ellipse cx="200" cy="165" rx="88" ry="48" fill="#F9FAFB"/>

  <!-- Cubos de papaya dulce anaranjada -->
  <rect x="150" y="145" width="22" height="22" rx="4" fill="#F97316"/>
  <rect x="180" y="160" width="20" height="20" rx="4" fill="#EA580C"/>
  <rect x="215" y="148" width="22" height="22" rx="4" fill="#F97316"/>

  <!-- Rodajas de plátano de seda -->
  <circle cx="165" cy="170" r="12" fill="#FEF08A" stroke="#FDE047" stroke-width="1.2"/>
  <circle cx="165" cy="170" r="3" fill="#A16207"/>
  <circle cx="195" cy="140" r="12" fill="#FEF08A" stroke="#FDE047" stroke-width="1.2"/>
  <circle cx="195" cy="140" r="3" fill="#A16207"/>

  <!-- Fresas rojas frescas en mitades -->
  <path d="M 175 145 C 170 135, 185 130, 190 145 C 190 152, 180 155, 175 145 Z" fill="#DC2626"/>
  <path d="M 210 165 C 205 155, 220 150, 225 165 C 225 172, 215 175, 210 165 Z" fill="#EF4444"/>

  <!-- Hilos de miel / algarrobina oscura por encima -->
  <path d="M 145 155 Q 175 170 210 145 Q 235 160 250 150" stroke="#78350F" stroke-width="2.5" fill="none"/>

  <!-- Badge Snack -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">SNACK</text>
</svg>
