<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FDFBF7"/>

  <!-- Plato llano grande -->
  <circle cx="200" cy="150" r="125" fill="#FFFFFF" stroke="#D5C5B2" stroke-width="2.5"/>

  <!-- Filete de pescado dorado a la plancha -->
  <path d="M 120 155 C 130 120, 200 125, 235 145 C 230 175, 160 180, 120 155 Z" fill="#D97706" stroke="#92400E" stroke-width="2"/>
  <path d="M 130 152 C 140 128, 195 132, 225 147 C 220 170, 165 174, 130 152 Z" fill="#F59E0B"/>
  <!-- Marcas de la parrilla / plancha -->
  <line x1="150" y1="135" x2="165" y2="165" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175" y1="138" x2="190" y2="168" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="142" x2="212" y2="165" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Puré de papa con mantequilla y toque cremoso -->
  <ellipse cx="230" cy="170" rx="42" ry="32" fill="#FEF08A" stroke="#FDE047" stroke-width="1.5"/>
  <ellipse cx="230" cy="168" rx="38" ry="26" fill="#FFFBEB"/>
  <rect x="225" y="162" width="10" height="8" rx="1.5" fill="#FACC15"/> <!-- Mantequilla derritiéndose -->

  <!-- Ensalada fresca: lechuga seda, rodaja de tomate y medio limón -->
  <path d="M 140 180 Q 155 170 170 185 Q 150 195 140 180" fill="#22C55E"/>
  <circle cx="165" cy="185" r="14" fill="#EF4444" stroke="#DC2626" stroke-width="1"/>
  <!-- Medio limón sutil verde -->
  <circle cx="125" cy="135" r="14" fill="#15803D" stroke="#166534" stroke-width="1.5"/>
  <circle cx="125" cy="135" r="11" fill="#84CC16"/>

  <!-- Badge Marino -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">MARINO</text>
</svg>
