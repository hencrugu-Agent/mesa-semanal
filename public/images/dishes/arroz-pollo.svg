<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#E5DCCE"/>
    </radialGradient>
    <radialGradient id="greenRiceGrad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="40%" stop-color="#22C55E"/>
      <stop offset="80%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#FDFBF7"/>
  <circle cx="200" cy="150" r="125" fill="url(#plateGrad)" stroke="#D5C5B2" stroke-width="3"/>
  <circle cx="200" cy="150" r="105" fill="#FBF7EE" stroke="#EFE6D8" stroke-width="2"/>

  <!-- Montículo de Arroz Verde chiclayano con culantro -->
  <ellipse cx="185" cy="155" rx="78" ry="62" fill="url(#greenRiceGrad)"/>
  <!-- Arvejitas, choclo y zanahoria incrustadas -->
  <circle cx="155" cy="145" r="5" fill="#166534" stroke="#14532D" stroke-width="1"/>
  <circle cx="175" cy="165" r="5" fill="#166534" stroke="#14532D" stroke-width="1"/>
  <circle cx="195" cy="155" r="5" fill="#166534"/>
  <rect x="145" y="160" width="7" height="7" rx="1.5" fill="#F97316"/>
  <rect x="185" y="135" width="7" height="7" rx="1.5" fill="#EA580C"/>
  <circle cx="165" cy="135" r="4.5" fill="#FBBF24"/>
  <circle cx="195" cy="170" r="4.5" fill="#FDE047"/>

  <!-- Presa de pierna con encuentro dorada -->
  <path d="M 180 130 C 175 110, 215 105, 235 125 C 255 145, 230 170, 205 160 Z" fill="#9A3412" stroke="#7C2D12" stroke-width="2" filter="drop-shadow(0 3px 5px rgba(0,0,0,0.2))"/>
  <ellipse cx="205" cy="130" rx="18" ry="12" fill="#B45309"/>

  <!-- Salsa Huancaína cremosa bañando papa en el costado -->
  <ellipse cx="240" cy="165" rx="28" ry="20" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
  <ellipse cx="240" cy="163" rx="24" ry="16" fill="#FBBF24"/>

  <!-- Badge Criollo -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">ALMUERZO</text>
</svg>
