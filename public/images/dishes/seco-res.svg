<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#E5DCCE"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#FDFBF7"/>
  <circle cx="200" cy="150" r="125" fill="url(#plateGrad)" stroke="#D5C5B2" stroke-width="3"/>

  <!-- Frejoles canario cremosos a la izquierda -->
  <ellipse cx="150" cy="160" rx="50" ry="40" fill="#CA8A04" stroke="#A16207" stroke-width="1.5"/>
  <ellipse cx="150" cy="158" rx="46" ry="36" fill="#EAB308"/>

  <!-- Seco de res en salsa verde oscura de culantro -->
  <ellipse cx="200" cy="145" rx="55" ry="42" fill="#14532D"/>
  <!-- Trozos tiernos de carne de res -->
  <rect x="175" y="130" width="35" height="25" rx="6" fill="#3B1E08"/>
  <rect x="195" y="145" width="30" height="22" rx="5" fill="#451A03"/>
  <ellipse cx="210" cy="135" rx="16" ry="12" fill="#2E1065" opacity="0.3"/>

  <!-- Porción de arroz blanco -->
  <ellipse cx="245" cy="160" rx="42" ry="34" fill="#FFFFFF" stroke="#E2D9CC" stroke-width="1.5"/>
  <ellipse cx="245" cy="158" rx="38" ry="28" fill="#FAF6EE"/>

  <!-- Badge Criollo -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">ALMUERZO</text>
</svg>
