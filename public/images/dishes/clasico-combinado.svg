<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FDFBF7"/>

  <!-- Dulcera tradicional de vidrio / porcelana -->
  <ellipse cx="200" cy="170" rx="110" ry="70" fill="#FFFFFF" stroke="#E5DCCE" stroke-width="2.5"/>

  <!-- Mitad Izquierda: Mazamorra morada brillante de maíz morado -->
  <path d="M 110 165 C 110 200, 195 210, 198 165 C 198 135, 120 135, 110 165 Z" fill="#581C87" stroke="#3B0764" stroke-width="1.5"/>
  <!-- Brillo y frutas secas en la mazamorra -->
  <ellipse cx="150" cy="165" rx="25" ry="15" fill="#6B21A8"/>
  <circle cx="160" cy="170" r="5" fill="#3B0764"/> <!-- Guindón -->

  <!-- Mitad Derecha: Arroz con leche cremoso blanco -->
  <path d="M 202 165 C 205 210, 290 200, 290 165 C 290 135, 202 135, 202 165 Z" fill="#FFFBEB" stroke="#E5E7EB" stroke-width="1.5"/>
  <ellipse cx="245" cy="165" rx="30" ry="18" fill="#FEF3C7"/>

  <!-- Canela en polvo espolvoreada en diagonal uniendo ambos -->
  <line x1="140" y1="150" x2="260" y2="180" stroke="#78350F" stroke-width="2" stroke-dasharray="2,3"/>

  <!-- Badge Postre -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">POSTRE</text>
</svg>
