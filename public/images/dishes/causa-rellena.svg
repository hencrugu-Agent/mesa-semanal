<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#E5DCCE"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#FDFBF7"/>
  <circle cx="200" cy="150" r="125" fill="url(#plateGrad)" stroke="#D5C5B2" stroke-width="3"/>

  <!-- Capa 1: Base de masa de papa amarilla y ají -->
  <ellipse cx="200" cy="180" rx="75" ry="32" fill="#D97706"/>
  <ellipse cx="200" cy="172" rx="72" ry="30" fill="#F59E0B"/>

  <!-- Capa 2: Relleno de palta fuerte en láminas verdes -->
  <ellipse cx="200" cy="158" rx="68" ry="26" fill="#15803D"/>
  <ellipse cx="200" cy="154" rx="65" ry="24" fill="#22C55E"/>

  <!-- Capa 3: Relleno de pechuga de pollo y mayonesa -->
  <ellipse cx="200" cy="142" rx="68" ry="25" fill="#FEF3C7"/>
  <ellipse cx="200" cy="138" rx="64" ry="23" fill="#FFFBEB"/>

  <!-- Capa 4: Tapa superior de masa dorada de papa amarilla -->
  <ellipse cx="200" cy="124" rx="68" ry="26" fill="#D97706"/>
  <ellipse cx="200" cy="118" rx="65" ry="24" fill="#FBBF24"/>

  <!-- Decoración tradicional: rodaja de huevo duro + aceituna negra -->
  <ellipse cx="185" cy="115" rx="16" ry="11" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <ellipse cx="185" cy="115" rx="8" ry="6" fill="#F59E0B"/>
  <ellipse cx="215" cy="115" rx="12" ry="9" fill="#18181B"/>
  <circle cx="213" cy="113" r="2" fill="#E4E4E7"/>

  <!-- Hojita de perejil / culantro -->
  <path d="M 198 105 Q 202 98 206 105 Q 202 110 198 105" fill="#15803D"/>

  <!-- Badge Entrada -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">ENTRADA</text>
</svg>
