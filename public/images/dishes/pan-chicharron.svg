<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FDFBF7"/>

  <!-- Plato plano rústico -->
  <ellipse cx="200" cy="165" rx="120" ry="75" fill="#F5EFE6" stroke="#D5C5B2" stroke-width="2.5"/>

  <!-- Pan crujiente base -->
  <ellipse cx="200" cy="175" rx="75" ry="35" fill="#D97706" stroke="#B45309" stroke-width="2"/>
  <ellipse cx="200" cy="170" rx="70" ry="30" fill="#FDE68A"/>

  <!-- Rodajas doradas de camote frito -->
  <ellipse cx="165" cy="165" rx="28" ry="16" fill="#EA580C" stroke="#C2410C" stroke-width="1.5"/>
  <ellipse cx="230" cy="168" rx="26" ry="15" fill="#EA580C" stroke="#C2410C" stroke-width="1.5"/>

  <!-- Generosos trozos de chicharrón de cerdo frito crujiente -->
  <rect x="160" y="135" width="45" height="28" rx="7" fill="#78350F" stroke="#451A03" stroke-width="1.5"/>
  <rect x="195" y="138" width="42" height="26" rx="6" fill="#92400E" stroke="#451A03" stroke-width="1.5"/>

  <!-- Salsa criolla (juliana de cebolla roja morada, ají limo y hierbabuena) -->
  <path d="M 165 130 Q 185 120 205 132" stroke="#9333EA" stroke-width="3" fill="none"/>
  <path d="M 180 125 Q 195 118 215 128" stroke="#A855F7" stroke-width="2.5" fill="none"/>
  <circle cx="190" cy="122" r="3" fill="#DC2626"/>
  <circle cx="178" cy="132" r="3" fill="#15803D"/>
  <circle cx="210" cy="130" r="3" fill="#15803D"/>

  <!-- Tapa superior del pan -->
  <ellipse cx="200" cy="115" rx="70" ry="28" fill="#D97706" stroke="#B45309" stroke-width="2"/>
  <ellipse cx="200" cy="110" rx="65" ry="22" fill="#F59E0B"/>

  <!-- Badge Desayuno -->
  <rect x="20" y="20" width="86" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="63" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">DESAYUNO</text>
</svg>
