<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FDFBF7"/>

  <!-- Tazón sopero hondo -->
  <ellipse cx="200" cy="165" rx="115" ry="80" fill="#F5EFE6" stroke="#D5C5B2" stroke-width="3"/>
  <!-- Caldo rojo aderezado con ají panca, leche y tomate -->
  <ellipse cx="200" cy="155" rx="98" ry="62" fill="#B91C1C"/>
  <ellipse cx="200" cy="155" rx="90" ry="54" fill="#C2410C"/>

  <!-- Fideos cabello de ángel entrelazados -->
  <path d="M 140 160 Q 170 145 200 165 Q 230 150 255 160" stroke="#FEF08A" stroke-width="2" fill="none"/>
  <path d="M 145 150 Q 185 170 215 145 Q 240 165 250 152" stroke="#FEF08A" stroke-width="2" fill="none"/>

  <!-- Carne molida aderezada -->
  <circle cx="160" cy="165" r="4" fill="#451A03"/>
  <circle cx="175" cy="150" r="4.5" fill="#451A03"/>
  <circle cx="225" cy="160" r="4" fill="#451A03"/>

  <!-- Huevo escalfado pochado en el centro -->
  <ellipse cx="195" cy="148" rx="28" ry="20" fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
  <circle cx="195" cy="146" r="11" fill="#F59E0B"/>

  <!-- Crutones de pan tostado y orégano seco -->
  <rect x="145" y="135" width="14" height="14" rx="2" fill="#D97706" transform="rotate(15 145 135)"/>
  <rect x="235" y="140" width="14" height="14" rx="2" fill="#D97706" transform="rotate(-20 235 140)"/>
  <circle cx="185" cy="138" r="2" fill="#15803D"/>
  <circle cx="205" cy="155" r="2" fill="#15803D"/>

  <!-- Badge Cena -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338CA" text-anchor="middle">CENA</text>
</svg>
