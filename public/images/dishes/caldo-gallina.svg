<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bowlGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#D5C5B2"/>
    </radialGradient>
    <radialGradient id="brothGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#FDFBF7"/>

  <!-- Tazón hondo de caldo criollo -->
  <ellipse cx="200" cy="165" rx="115" ry="85" fill="url(#bowlGrad)" stroke="#B8A793" stroke-width="3"/>
  <!-- Caldo dorado humeante -->
  <ellipse cx="200" cy="155" rx="95" ry="65" fill="url(#brothGrad)"/>

  <!-- Fideos largos sumergidos -->
  <path d="M 140 150 Q 170 170 200 145 Q 230 160 260 140" stroke="#FEF9C3" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 150 160 Q 185 140 215 165 Q 240 145 255 155" stroke="#FEF9C3" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Presa de gallina tierna -->
  <path d="M 150 140 Q 165 115 190 130 Q 195 150 170 155 Z" fill="#B45309" stroke="#78350F" stroke-width="1.5"/>

  <!-- Huevo duro entero / partido -->
  <ellipse cx="225" cy="140" rx="18" ry="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <ellipse cx="225" cy="140" rx="10" ry="8" fill="#F59E0B"/>

  <!-- Cebollita china picada en aros verdes flotando -->
  <circle cx="150" cy="170" r="4" fill="#15803D"/>
  <circle cx="170" cy="175" r="3.5" fill="#16A34A"/>
  <circle cx="190" cy="170" r="4" fill="#15803D"/>
  <circle cx="210" cy="165" r="3.5" fill="#16A34A"/>
  <circle cx="240" cy="160" r="4" fill="#15803D"/>

  <!-- Vapor caliente ascendente -->
  <path d="M 180 90 Q 175 75 185 65" stroke="#D1D5DB" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 210 95 Q 215 80 205 65" stroke="#D1D5DB" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Badge Sopa -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#B45309" text-anchor="middle">SOPA</text>
</svg>
