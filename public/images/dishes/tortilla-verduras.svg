<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FDFBF7"/>

  <!-- Plato llano -->
  <circle cx="200" cy="150" r="125" fill="#FFFFFF" stroke="#D5C5B2" stroke-width="2.5"/>

  <!-- Tortilla esponjosa dorada redonda -->
  <ellipse cx="200" cy="150" rx="85" ry="65" fill="#F59E0B" stroke="#D97706" stroke-width="2" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.1))"/>
  <ellipse cx="200" cy="148" rx="80" ry="60" fill="#FBBF24"/>

  <!-- Hojas de espinaca verde salteadas visibles -->
  <path d="M 150 140 Q 165 130 170 145 Q 155 155 150 140" fill="#15803D"/>
  <path d="M 215 150 Q 230 140 235 155 Q 220 165 215 150" fill="#166534"/>
  <path d="M 175 165 Q 190 155 195 170 Q 180 180 175 165" fill="#15803D"/>

  <!-- Tiritas dulces de zanahoria rallada -->
  <line x1="165" y1="135" x2="185" y2="140" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
  <line x1="205" y1="135" x2="225" y2="142" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="155" x2="200" y2="160" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>

  <!-- Granos dorados de choclo tierno -->
  <circle cx="155" cy="165" r="5" fill="#FEF08A" stroke="#EAB308" stroke-width="1"/>
  <circle cx="225" cy="165" r="5" fill="#FEF08A" stroke="#EAB308" stroke-width="1"/>
  <circle cx="190" cy="140" r="5" fill="#FEF08A" stroke="#EAB308" stroke-width="1"/>

  <!-- Badge Cena -->
  <rect x="20" y="20" width="76" height="26" rx="13" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.2"/>
  <text x="58" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4338CA" text-anchor="middle">CENA</text>
</svg>
